openapi: 3.0.3
info:
  title: Personal+ API — contrato que o app precisa
  version: 1.0.0
  description: |
    Contrato completo que o app **Personal+** (Expo / React Native) consome.
    Base: o backend atual em `https://api.personal.matbessa.com.br` (v0.1.0), comparado em 27/10/2026.

    Cada operação começa com o status dela:

    | Status | Significado |
    | --- | --- |
    | **[OK]** | Já existe e está igual ao contrato. Não mexer. |
    | **[AJUSTAR]** | Já existe, mas o corpo, a resposta ou a regra precisa mudar como descrito na operação. |
    | **[FALTA]** | Não existe. Implementar exatamente como descrito. |

    ## Convenções (valem para todos os endpoints)

    1. **Sem prefixo de versão.** Os caminhos são exatamente os deste documento (`/auth/login`, `/personal/students`...).
    2. **JSON em camelCase** em todas as requisições e respostas. Nunca snake_case.
    3. **IDs são inteiros.**
    4. **Datas:** data e hora em ISO 8601 UTC (`2026-10-27T13:24:38Z`); só data em `YYYY-MM-DD`.
    5. **Autenticação:** `Authorization: Bearer <JWT>`. Endpoints sem cadeado são públicos.
    6. **Papéis:** rotas `/personal/*` só para `role = personal`; rotas `/aluno/*` só para `role = aluno`. Papel errado → `403` com `code: FORBIDDEN_ROLE`.
    7. **Vínculo:** toda rota `/personal/students/{studentId}/*` exige vínculo ativo entre o Personal logado e o aluno. Sem vínculo → `404` com `code: STUDENT_NOT_FOUND` (não revelar que o aluno existe).
    8. **PATCH é parcial:** só os campos enviados mudam. Campo ausente nunca é apagado. Para limpar um campo opcional, o app envia `null`.
    9. **Erros** sempre no formato `Error`: `{"error": "mensagem legível", "code": "CODIGO_ESTAVEL"}`. O app traduz pelo `code`, então ele nunca pode mudar. Nunca devolver mensagem de banco/ORM.
    10. **Sem paginação** nesta versão: listas devolvem tudo, ordenadas como indicado em cada endpoint.
    11. **CORS obrigatório:** responder ao preflight `OPTIONS` com `Access-Control-Allow-Origin: *`, `Access-Control-Allow-Methods: GET, POST, PUT, PATCH, DELETE, OPTIONS` e `Access-Control-Allow-Headers: Authorization, Content-Type`. Hoje o preflight responde 200 sem esses headers, e a versão web do app fica bloqueada.

    ## Códigos de erro

    | HTTP | code | Quando |
    | --- | --- | --- |
    | 400 | `VALIDATION_ERROR` | Corpo inválido. `error` diz qual campo. |
    | 401 | `UNAUTHORIZED` | Token ausente, inválido, expirado ou revogado. |
    | 401 | `INVALID_CREDENTIALS` | Login com e-mail ou senha errados. |
    | 403 | `FORBIDDEN_ROLE` | Papel errado para a rota. |
    | 403 | `PLAN_LIMIT_REACHED` | Personal atingiu o limite de alunos do plano. |
    | 404 | `NOT_FOUND` | Recurso não existe ou não pertence ao usuário. |
    | 404 | `STUDENT_NOT_FOUND` | Aluno inexistente ou sem vínculo ativo com o Personal. |
    | 404 | `WORKOUT_NOT_FOUND` | Aluno sem treino vigente. |
    | 404 | `ANAMNESIS_NOT_FOUND` | Anamnese ainda não preenchida. |
    | 409 | `EMAIL_TAKEN` | E-mail já cadastrado. |
    | 409 | `ALREADY_LINKED` | Aluno já tem vínculo ativo com outro Personal. |
    | 409 | `EXERCISE_IN_USE` | Exercício customizado usado em algum treino. |
    | 409 | `PHOTO_LIMIT_REACHED` | Aluno com 90 fotos de progresso. |
    | 413 | `FILE_TOO_LARGE` | Upload acima de 10 MB. |
    | 415 | `UNSUPPORTED_MEDIA_TYPE` | Upload que não é JPEG, PNG ou WebP. |

    ## Limites de plano do Personal

    | personalPlan | Máximo de alunos com vínculo ativo |
    | --- | --- |
    | `free` | 1 |
    | `pro` | 5 |
    | `unlimited` | sem limite |
servers:
  - url: https://api.personal.matbessa.com.br
    description: Produção
  - url: http://localhost:5000
    description: Local
tags:
  - name: Sistema
    description: Saúde do serviço.
  - name: Autenticação
    description: Contas e sessões. Ajustes no que já existe.
  - name: Perfil
    description: Dados do próprio usuário (Personal e Aluno), foto e privacidade.
  - name: Alunos do Personal
    description: O Personal cadastra, lista, edita e desvincula alunos, e lê os dados de saúde deles.
  - name: Vínculo do Aluno
    description: O aluno encontra o Personal e confirma o vínculo.
  - name: Exercícios
    description: Catálogo global e exercícios customizados do Personal.
  - name: Treino (Personal)
    description: O Personal monta o treino vigente do aluno, dividido em dias (A, B, C...).
  - name: Treino (Aluno)
    description: O aluno lê o treino, executa sessões e marca séries.
  - name: Saúde e evolução (Aluno)
    description: Anamnese, medidas corporais e fotos de progresso.
  - name: Notificações
    description: Avisos para Personal e Aluno. Mesmas rotas para os dois papéis.
  - name: Personal
    description: Painel e indicações.
  - name: Pagamentos simulados
    description: Fluxos de pagamento que hoje só aprovam. Precisam persistir o resultado.
  - name: Suporte
    description: Tickets de suporte.
security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Sistema]
      summary: '[OK] Health check'
      x-status: ok
      security: []
      responses:
        '200':
          description: Serviço no ar.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, example: ok }

  # ---------------------------------------------------------------- Auth
  /auth/signup:
    post:
      tags: [Autenticação]
      summary: '[AJUSTAR] Criar conta'
      x-status: ajustar
      description: |
        **O que muda:** hoje o corpo só aceita `email`, `password` e `role`, e a resposta devolve só `{id, email, role}`.

        1. Aceitar `name` (obrigatório), `personalPlan` e `referralCode`.
        2. `personalPlan` só vale para `role = personal`; padrão `free`. Para aluno, ignorar e gravar `null`.
        3. Para Personal, gerar `referralCode` único: 8 caracteres `A-Z0-9`, sem `0/O/1/I`.
        4. Se `referralCode` for enviado, `role = personal` e `personalPlan` for `pro` ou `unlimited`: criar um `Referral` para o dono do código com `credit = 5` e `status = pending`, e devolver `referralApplied: true` + `referrerName`. Código inexistente não é erro: `referralApplied: false`.
        5. Responder `201` com `AuthResponse` contendo o `User` completo.
        6. Disparar a regra de vínculo pendente: se algum Personal já tinha cadastrado este e-mail (ver `POST /personal/students`), a conta nova já nasce vinculada.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: Conta criada e sessão iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignupResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409':
          description: '`EMAIL_TAKEN`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      tags: [Autenticação]
      summary: '[AJUSTAR] Entrar'
      x-status: ajustar
      description: |
        **O que muda:** a resposta precisa trazer o `User` completo (hoje vem só `{id, email, role}`), e o corpo não deve exigir nem usar `role`.

        Senha errada ou e-mail inexistente → `401` com `code: INVALID_CREDENTIALS` (mesma resposta nos dois casos).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Sessão iniciada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401':
          description: '`INVALID_CREDENTIALS`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      tags: [Autenticação]
      summary: '[AJUSTAR] Usuário logado'
      x-status: ajustar
      description: |
        **O que muda:** hoje responde `{"user": {id, email, role}}`. Deve responder o objeto `User` completo **direto**, sem envelope.
        O app chama este endpoint ao abrir para restaurar a sessão.
      responses:
        '200':
          description: Usuário logado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Autenticação]
      summary: '[OK] Sair'
      x-status: ok
      description: Revoga o token atual (pelo `jti`). Depois disso, o mesmo token recebe `401`.
      responses:
        '204': { description: Sessão encerrada. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [Autenticação]
      summary: '[AJUSTAR] Renovar sessão'
      x-status: ajustar
      description: |
        **O que muda:** documentar a resposta e revogar o token antigo.

        1. Emitir um token novo com a mesma validade de um login.
        2. Revogar o `jti` do token usado na chamada.
        3. Responder `{"token": "..."}`.
      responses:
        '200':
          description: Token novo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/forgot-password:
    post:
      tags: [Autenticação]
      summary: '[AJUSTAR] Esqueci a senha'
      x-status: ajustar
      description: |
        **O que muda:** hoje responde `503 password reset delivery is unavailable`.

        1. Gerar um código de 6 dígitos, válido por 30 minutos e de uso único.
        2. Enviar por e-mail. Enquanto não houver provedor de e-mail, logar o código no servidor (nunca devolver na resposta).
        3. Responder **sempre** `202`, exista o e-mail ou não, para não revelar quais e-mails têm conta.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: Se o e-mail existir, o código foi enviado. Corpo vazio. }
        '400': { $ref: '#/components/responses/ValidationError' }

  /auth/reset-password:
    post:
      tags: [Autenticação]
      summary: '[OK] Redefinir senha'
      x-status: ok
      description: |
        `token` é o código de 6 dígitos de `/auth/forgot-password`. Código errado, expirado ou já usado → `400` `VALIDATION_ERROR`.
        Ao redefinir, revogar todas as sessões abertas do usuário.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, password]
              properties:
                email: { type: string, format: email }
                token: { type: string, example: '482913' }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '200': { description: Senha redefinida. }
        '400': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- Perfil
  /personal/profile/complete:
    post:
      tags: [Perfil]
      summary: '[AJUSTAR] Completar perfil do Personal (onboarding)'
      x-status: ajustar
      description: |
        **O que muda:** aceitar todos os campos de `PersonalProfileRequest` (hoje só `name`, `personalPlan`, `isPublic`), com semântica de PATCH, e devolver `User`.
        Grava `profileCompletedAt` na primeira chamada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalProfileRequest' }
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }

  /personal/profile/update:
    put:
      tags: [Perfil]
      summary: '[AJUSTAR] Atualizar perfil do Personal'
      x-status: ajustar
      description: |
        **O que muda:** mesmo corpo de `/personal/profile/complete`, com semântica de PATCH (só os campos enviados mudam), e resposta `User`.
        `personalPlan` **não** pode ser alterado aqui (ignorar se vier): só por `POST /personal/plan/upgrade`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PersonalProfileRequest' }
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }

  /aluno/profile/complete:
    post:
      tags: [Perfil]
      summary: '[AJUSTAR] Completar perfil do Aluno (onboarding)'
      x-status: ajustar
      description: |
        **O que muda:** hoje exige `name` e `email`. Aceitar todos os campos de `StudentProfileRequest`, todos opcionais, com semântica de PATCH, e devolver `User`.
        Grava `profileCompletedAt` na primeira chamada.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentProfileRequest' }
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }

  /aluno/profile/update:
    put:
      tags: [Perfil]
      summary: '[AJUSTAR] Atualizar perfil do Aluno'
      x-status: ajustar
      description: |
        **O que muda:** igual a `/aluno/profile/complete`: todos os campos opcionais, semântica de PATCH, resposta `User`.
        Trocar `email` exige que o novo e-mail não esteja em uso (`409 EMAIL_TAKEN`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentProfileRequest' }
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
        '409':
          description: '`EMAIL_TAKEN`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /aluno/profile/privacy:
    put:
      tags: [Perfil]
      summary: '[FALTA] Visibilidade do histórico do aluno'
      x-status: falta
      description: Grava `isPublic` do aluno (`public` → `true`). Devolve `User`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility: { type: string, enum: [private, public] }
      responses:
        '200':
          description: Visibilidade atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }

  /profile/photo:
    post:
      tags: [Perfil]
      summary: '[FALTA] Trocar foto de perfil (Personal e Aluno)'
      x-status: falta
      description: |
        1. `multipart/form-data` com o campo `file`. Aceitar só `image/jpeg`, `image/png`, `image/webp` (checar o conteúdo, não só o header). Máximo 10 MB.
        2. Substitui a foto anterior (apagar o arquivo antigo).
        3. Grava `photoUrl` no usuário apontando para `GET /photos/{photoId}/content` e devolve o `User`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Foto trocada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /photos/{photoId}/content:
    get:
      tags: [Perfil]
      summary: '[FALTA] Conteúdo de uma foto'
      x-status: falta
      description: |
        Devolve o binário da imagem com o `Content-Type` original e `Cache-Control: private, max-age=86400`.

        Quem pode ver:
        - Foto de perfil: qualquer usuário autenticado.
        - Foto de progresso: o próprio aluno e o Personal com vínculo ativo.

        Qualquer outro caso → `404 NOT_FOUND`. O app carrega a imagem com o header `Authorization`.
      parameters:
        - $ref: '#/components/parameters/PhotoId'
      responses:
        '200':
          description: Imagem.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Alunos do Personal
  /personal/students:
    get:
      tags: [Alunos do Personal]
      summary: '[FALTA] Listar meus alunos'
      x-status: falta
      description: Alunos com vínculo ativo **e** cadastros pendentes (`status = pending_signup`), ordenados por `name`.
      responses:
        '200':
          description: Alunos.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StudentSummary' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
    post:
      tags: [Alunos do Personal]
      summary: '[FALTA] Cadastrar e vincular aluno'
      x-status: falta
      description: |
        Regras, nesta ordem:

        1. Checar o limite do plano (contando vínculos ativos e pendentes). Atingido → `403 PLAN_LIMIT_REACHED`.
        2. **E-mail já é um aluno com vínculo ativo com outro Personal** → `409 ALREADY_LINKED`.
        3. **E-mail já é um aluno com vínculo ativo comigo** → só atualiza os dados de agenda e cobrança e responde `200` com `relinked: true`.
        4. **E-mail já é um aluno sem vínculo ativo** → cria o vínculo, responde `201` com `relinked: true`. Notificar o aluno (`link_confirmed`).
        5. **E-mail já é de um Personal** → `409 EMAIL_TAKEN`.
        6. **E-mail não existe** → **não** criar conta. Criar um vínculo pendente (`status = pending_signup`) guardando nome e e-mail. Quando alguém fizer signup como aluno com esse e-mail, o vínculo vira ativo automaticamente e o Personal recebe `link_confirmed`. Responder `201` com `relinked: false`.

        Em todos os casos de sucesso, gravar `goal`, `days`, `time`, `paymentValue` no vínculo.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStudentRequest' }
      responses:
        '200':
          description: Aluno já era meu; dados atualizados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateStudentResponse' }
        '201':
          description: Vínculo criado (ativo ou pendente).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateStudentResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403':
          description: '`FORBIDDEN_ROLE` ou `PLAN_LIMIT_REACHED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: '`ALREADY_LINKED` ou `EMAIL_TAKEN`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /personal/students/{studentId}:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Alunos do Personal]
      summary: '[FALTA] Detalhe de um aluno'
      x-status: falta
      responses:
        '200':
          description: Aluno.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentSummary' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
    patch:
      tags: [Alunos do Personal]
      summary: '[FALTA] Editar dados do aluno no vínculo'
      x-status: falta
      description: |
        Semântica de PATCH. O Personal edita só dados do **vínculo** (objetivo, nível, agenda, cobrança) e o `name` exibido.
        O Personal **não** pode trocar o e-mail nem a senha do aluno.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStudentRequest' }
      responses:
        '200':
          description: Aluno atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentSummary' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/StudentNotFound' }
    delete:
      tags: [Alunos do Personal]
      summary: '[FALTA] Desvincular aluno'
      x-status: falta
      description: |
        Encerra o vínculo (`endedAt = agora`); não apaga a conta do aluno nem os dados de saúde dele.
        O treino vigente criado por este Personal é arquivado. Pendente de cadastro → apagar o vínculo pendente.
      responses:
        '204': { description: Vínculo encerrado. }
        '404': { $ref: '#/components/responses/StudentNotFound' }

  /personal/students/{studentId}/billing:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    put:
      tags: [Pagamentos simulados]
      summary: '[FALTA] Cobrança mensal do aluno'
      x-status: falta
      description: |
        Simulado: não cobra ninguém. Grava os campos no vínculo (semântica de PATCH) e devolve o aluno atualizado.
        Quando `paymentStatus` muda de `pendente` para `pago`, criar notificação `payment_received` para o Personal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillingRequest' }
      responses:
        '200':
          description: Cobrança atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentSummary' }
        '404': { $ref: '#/components/responses/StudentNotFound' }

  /personal/students/{studentId}/anamnese:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Alunos do Personal]
      summary: '[FALTA] Ler anamnese do aluno'
      x-status: falta
      description: Mesma resposta de `GET /aluno/anamnese`, para o Personal vinculado.
      responses:
        '200':
          description: Anamnese.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Anamnesis' }
        '404':
          description: '`STUDENT_NOT_FOUND` ou `ANAMNESIS_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /personal/students/{studentId}/measurements:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Alunos do Personal]
      summary: '[FALTA] Ler medidas do aluno'
      x-status: falta
      description: Mesma lista de `GET /aluno/measurements` (mais antiga primeiro), para o Personal vinculado.
      responses:
        '200':
          description: Medidas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Measurement' }
