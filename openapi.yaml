  # ---------------------------------------------------------------- Vínculo do aluno
  /aluno/link:
    get:
      tags: [Vínculo do Aluno]
      summary: '[FALTA] Meu Personal'
      x-status: falta
      description: Vínculo ativo do aluno, com os dados públicos do Personal. Sem vínculo → `404 NOT_FOUND`.
      responses:
        '200':
          description: Vínculo ativo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentLink' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
    delete:
      tags: [Vínculo do Aluno]
      summary: '[FALTA] Aluno encerra o vínculo'
      x-status: falta
      description: Mesmo efeito de `DELETE /personal/students/{studentId}`, iniciado pelo aluno. Notifica o Personal.
      responses:
        '204': { description: Vínculo encerrado. }
        '404': { $ref: '#/components/responses/NotFound' }

  /aluno/vinculo/check:
    get:
      tags: [Vínculo do Aluno]
      summary: '[FALTA] Buscar Personal pelo e-mail'
      x-status: falta
      description: |
        O aluno digita o e-mail do Personal. Busca exata, sem diferenciar maiúsculas.
        Só encontra usuários `role = personal`. Não encontrado → `404 NOT_FOUND`.
      parameters:
        - name: email
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: Personal encontrado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonalPreview' }
        '404': { $ref: '#/components/responses/NotFound' }

  /aluno/vinculo/confirm:
    post:
      tags: [Vínculo do Aluno]
      summary: '[FALTA] Confirmar vínculo com o Personal'
      x-status: falta
      description: |
        1. Aluno já tem vínculo ativo → `409 ALREADY_LINKED`.
        2. Personal no limite do plano → `403 PLAN_LIMIT_REACHED`.
        3. Cria o vínculo ativo, notifica o Personal (`link_confirmed`) e responde `201` com `StudentLink`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personalId]
              properties:
                personalId: { type: integer }
      responses:
        '201':
          description: Vínculo criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentLink' }
        '403':
          description: '`FORBIDDEN_ROLE` ou `PLAN_LIMIT_REACHED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`ALREADY_LINKED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Exercícios
  /personal/exercises:
    get:
      tags: [Exercícios]
      summary: '[FALTA] Catálogo de exercícios'
      x-status: falta
      description: |
        Exercícios globais (`isCustom = false`, visíveis a todos os Personais) + os customizados **do próprio** Personal. Ordenar por `name`.

        **Seed obrigatório** do catálogo global (o app usa estes nomes):
        Supino Reto com Barra (Peito, Intermediário), Crossover Polia Alta (Peito, Avançado), Puxada Alta na Polia (Costas, Iniciante), Remada Baixa Sentada (Costas, Iniciante), Agachamento Livre Barra (Pernas, Avançado), Leg Press 45 Graus (Pernas, Intermediário), Desenvolvimento Halteres (Ombros, Intermediário), Rosca Direta com Barra W (Braços, Iniciante).
      responses:
        '200':
          description: Catálogo.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Exercise' }
        '403': { $ref: '#/components/responses/ForbiddenRole' }
    post:
      tags: [Exercícios]
      summary: '[FALTA] Criar exercício customizado'
      x-status: falta
      description: Cria com `isCustom = true`, visível **só** para o Personal que criou. Nome repetido entre os customizados dele → `400 VALIDATION_ERROR`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExerciseRequest' }
      responses:
        '201':
          description: Exercício criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exercise' }
        '400': { $ref: '#/components/responses/ValidationError' }

  /personal/exercises/{exerciseId}:
    parameters:
      - $ref: '#/components/parameters/ExerciseId'
    patch:
      tags: [Exercícios]
      summary: '[FALTA] Editar exercício customizado'
      x-status: falta
      description: Só os customizados do próprio Personal. Global ou de outro Personal → `404 NOT_FOUND`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExerciseRequest' }
      responses:
        '200':
          description: Exercício atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Exercise' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Exercícios]
      summary: '[FALTA] Excluir exercício customizado'
      x-status: falta
      description: Só se não estiver em nenhum treino (vigente ou arquivado). Em uso → `409 EXERCISE_IN_USE`.
      responses:
        '204': { description: Excluído. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`EXERCISE_IN_USE`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Treino (Personal)
  /personal/students/{studentId}/training:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Treino (Personal)]
      summary: '[FALTA] Treino vigente do aluno'
      x-status: falta
      description: Sem treino vigente → `404 WORKOUT_NOT_FOUND`.
      responses:
        '200':
          description: Treino vigente com exercícios ordenados por `split` e `order`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workout' }
        '404':
          description: '`STUDENT_NOT_FOUND` ou `WORKOUT_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Treino (Personal)]
      summary: '[FALTA] Criar ou alterar a estrutura do treino'
      x-status: falta
      description: |
        Cria o treino vigente se não existir (`201`), senão altera (`200`).

        1. `division` são letras maiúsculas sem repetir, em ordem, de 1 a 7 (`A`, `AB`, `ABC`... `ABCDEFG`). Outro formato → `400`.
        2. Se a nova `division` remover letras, **apagar** os exercícios prescritos nesses dias.
        3. `splitLabels` só pode ter chaves que estão em `division`; letras sem label ficam `""`.
        4. Incrementar `version`, gravar uma `Revision` e notificar o aluno (regra de notificação em `Workout`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkoutStructureRequest' }
      responses:
        '200':
          description: Treino alterado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workout' }
        '201':
          description: Treino criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workout' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/StudentNotFound' }

  /personal/students/{studentId}/training/exercises:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [Treino (Personal)]
      summary: '[FALTA] Prescrever exercício'
      x-status: falta
      description: |
        1. Sem treino vigente → criar um automaticamente com `title = "Treino"`, `division = split` informado.
        2. `split` precisa estar em `division`. Não está → `400`.
        3. `exerciseId` precisa ser global ou customizado do próprio Personal. Senão → `404 NOT_FOUND`.
        4. `order` padrão = último + 1 dentro do mesmo `split`.
        5. Incrementar `version` do treino, gravar `Revision`, notificar o aluno.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrescribedExerciseRequest' }
      responses:
        '201':
          description: Exercício prescrito.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescribedExercise' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/StudentNotFound' }

  /personal/students/{studentId}/training/exercises/{prescribedId}:
    parameters:
      - $ref: '#/components/parameters/StudentId'
      - $ref: '#/components/parameters/PrescribedId'
    patch:
      tags: [Treino (Personal)]
      summary: '[FALTA] Editar exercício prescrito'
      x-status: falta
      description: |
        Semântica de PATCH (campos ausentes não mudam). Pode trocar o exercício (`exerciseId`), o dia (`split`) e a ordem.
        Incrementar `version`, gravar `Revision`, notificar o aluno.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrescribedExercisePatch' }
      responses:
        '200':
          description: Exercício atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescribedExercise' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Treino (Personal)]
      summary: '[FALTA] Remover exercício prescrito'
      x-status: falta
      description: Incrementar `version`, gravar `Revision`, notificar o aluno.
      responses:
        '204': { description: Removido. }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Treino (Aluno)
  /aluno/training:
    get:
      tags: [Treino (Aluno)]
      summary: '[FALTA] Meu treino vigente'
      x-status: falta
      description: Mesmo objeto de `GET /personal/students/{studentId}/training`. Sem treino → `404 WORKOUT_NOT_FOUND`.
      responses:
        '200':
          description: Treino vigente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workout' }
        '404':
          description: '`WORKOUT_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /aluno/training/revisions:
    get:
      tags: [Treino (Aluno)]
      summary: '[FALTA] Histórico de versões do treino'
      x-status: falta
      description: Revisões do treino vigente, mais recente primeiro.
      responses:
        '200':
          description: Revisões.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Revision' }

  /aluno/sessions:
    post:
      tags: [Treino (Aluno)]
      summary: '[FALTA] Iniciar sessão de treino'
      x-status: falta
      description: |
        Inicia a execução de um dia do treino vigente. `split` precisa estar na `division`.
        Se houver uma sessão do aluno sem `finishedAt` iniciada há menos de 4 horas, devolver **essa** (`200`) em vez de criar outra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [split]
              properties:
                split: { type: string, example: A }
      responses:
        '200':
          description: Sessão aberta já existente.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '201':
          description: Sessão criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404':
          description: '`WORKOUT_NOT_FOUND`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /aluno/sessions/{sessionId}/sets/{prescribedId}/{setIndex}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
      - $ref: '#/components/parameters/PrescribedId'
      - name: setIndex
        in: path
        required: true
        description: Índice da série, começando em 0. Menor que `sets` do exercício prescrito.
        schema: { type: integer, minimum: 0 }
    put:
      tags: [Treino (Aluno)]
      summary: '[FALTA] Marcar ou desmarcar série'
      x-status: falta
      description: |
        **Upsert idempotente**: cria ou substitui o registro da série. Chamar duas vezes com o mesmo corpo dá o mesmo resultado (nunca `409`).
        O app chama a cada toque no checkbox da série. Sessão finalizada → `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetLogRequest' }
      responses:
        '200':
          description: Série gravada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetLog' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /aluno/sessions/{sessionId}/finish:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      tags: [Treino (Aluno)]
      summary: '[FALTA] Finalizar sessão'
      x-status: falta
      description: Grava `finishedAt`, `durationSeconds` e `feedback`. Notifica o Personal (`workout_completed`). Já finalizada → devolve como está.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                feedback: { type: string, maxLength: 2000 }
      responses:
        '200':
          description: Sessão finalizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '404': { $ref: '#/components/responses/NotFound' }

  /aluno/stats:
    get:
      tags: [Treino (Aluno)]
      summary: '[FALTA] Minhas estatísticas'
      x-status: falta
      description: |
        Calcular em America/Sao_Paulo. Semana = segunda a domingo.

        - `totalSessions`: sessões finalizadas desde sempre.
        - `sessionsThisWeek`: sessões finalizadas na semana atual.
        - `weeklyGoal`: `daysPerWeek` do perfil do aluno (padrão 3).
        - `consecutiveWeeks`: semanas seguidas, até a atual, com `sessionsThisWeek >= weeklyGoal` (a atual só conta se já bateu a meta).
        - `weekDays`: os 7 dias da semana atual; `trained = true` se houve sessão finalizada naquele dia.
      responses:
        '200':
          description: Estatísticas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentStats' }

