    get:
      tags: [Personal]
      summary: '[FALTA] Validar código de indicação (público)'
      x-status: falta
      description: |
        **Sem autenticação**: o código é digitado na tela de cadastro, antes de existir conta.
        Sem diferenciar maiúsculas. Nunca devolver e-mail ou id do dono. Aplicar rate limit de 30 req/min por IP.
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, example: JWAFQGV7 }
      responses:
        '200':
          description: Resultado.
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: { type: boolean }
                  ownerName: { type: string, nullable: true, example: Vitória Neri }

  # ---------------------------------------------------------------- Pagamentos
  /personal/plan/upgrade:
    post:
      tags: [Pagamentos simulados]
      summary: '[FALTA] Trocar plano do Personal'
      x-status: falta
      description: |
        Simulado: aprova sempre. **Precisa gravar** `personalPlan` no usuário e devolver o `User` atualizado.
        Downgrade para um plano com limite menor que os alunos atuais → `403 PLAN_LIMIT_REACHED` (não desvincular ninguém).
        Primeiro pagamento aprovado de `pro`/`unlimited` marca o `Referral` correspondente como `applied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, enum: [free, pro, unlimited] }
      responses:
        '200':
          description: Plano trocado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403':
          description: '`FORBIDDEN_ROLE` ou `PLAN_LIMIT_REACHED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /aluno/consultoria/checkout:
    post:
      tags: [Pagamentos simulados]
      summary: '[FALTA] Contratar consultoria online'
      x-status: falta
      description: |
        Simulado: aprova sempre.

        1. Aluno com vínculo ativo → `409 ALREADY_LINKED`.
        2. Vincular o aluno ao Personal oficial da consultoria, cujo id vem da variável de ambiente `OFFICIAL_PERSONAL_ID`. Esse vínculo **não** conta no limite de plano.
        3. Gravar a assinatura: `startsAt = hoje`, `endsAt` = +1, +3 ou +6 meses.
        4. Responder `200` com `ConsultoriaCheckoutResponse`.

        Preços (só exibição): mensal R$ 99,90 · trimestral R$ 279,90 · semestral R$ 569,90.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan, paymentMethod]
              properties:
                plan: { type: string, enum: [mensal, trimestral, semestral] }
                paymentMethod: { type: string, enum: [pix, card] }
      responses:
        '200':
          description: Contratado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsultoriaCheckoutResponse' }
        '409':
          description: '`ALREADY_LINKED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ---------------------------------------------------------------- Suporte
  /support/tickets:
    post:
      tags: [Suporte]
      summary: '[FALTA] Abrir ticket de suporte'
      x-status: falta
      description: Personal ou Aluno. Gravar quem abriu (id, papel, e-mail) a partir do token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, message]
              properties:
                category: { type: string, enum: ['Dúvida', 'Reclamação', 'Elogio', 'Sugestão', 'Feedback'] }
                message: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: Ticket criado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '400': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    StudentId:
      name: studentId
      in: path
      required: true
      description: '`id` do aluno (`StudentSummary.id`). Para cadastro pendente, é o `id` do vínculo pendente.'
      schema: { type: integer }
    ExerciseId:
      name: exerciseId
      in: path
      required: true
      schema: { type: integer }
    PrescribedId:
      name: prescribedId
      in: path
      required: true
      description: '`id` do `PrescribedExercise` (não do `Exercise` do catálogo).'
      schema: { type: integer }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: integer }
    PhotoId:
      name: photoId
      in: path
      required: true
      schema: { type: integer }

  responses:
    ValidationError:
      description: '`VALIDATION_ERROR`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: 'password must have at least 8 characters', code: VALIDATION_ERROR }
    Unauthorized:
      description: '`UNAUTHORIZED`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ForbiddenRole:
      description: '`FORBIDDEN_ROLE`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    StudentNotFound:
      description: '`STUDENT_NOT_FOUND`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    FileTooLarge:
      description: '`FILE_TOO_LARGE`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: '`UNSUPPORTED_MEDIA_TYPE`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, example: 'email is already registered' }
        code: { type: string, example: EMAIL_TAKEN }

    # ---- Auth
    SignupRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 120, example: Vitória Neri }
        email: { type: string, format: email, description: 'Gravar em minúsculas e sem espaços.' }
        password: { type: string, format: password, minLength: 8 }
        role: { type: string, enum: [personal, aluno] }
        personalPlan: { type: string, enum: [free, pro, unlimited], description: 'Só para personal. Padrão free.' }
        referralCode: { type: string, description: 'Só para personal. Opcional.' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string, description: JWT }
        user: { $ref: '#/components/schemas/User' }
    SignupResponse:
      allOf:
        - $ref: '#/components/schemas/AuthResponse'
        - type: object
          required: [referralApplied]
          properties:
            referralApplied: { type: boolean }
            referrerName: { type: string, nullable: true }
    TokenResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }

    # ---- Usuário
    User:
      type: object
      description: |
        Usuário completo. Campos de Personal são `null` para aluno e vice-versa.
        Sempre devolver **todas** as chaves (com `null` quando vazio), nunca omitir.
      required: [id, name, email, role, isPublic, photoUrl, phone, profileCompletedAt, createdAt]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Vitória Neri }
        email: { type: string, format: email }
        role: { type: string, enum: [personal, aluno] }
        isPublic: { type: boolean, description: 'Personal: aparece em buscas. Aluno: histórico visível.' }
        photoUrl: { type: string, nullable: true, example: '/photos/12/content' }
        phone: { type: string, nullable: true, example: '+5511999999999' }
        profileCompletedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        personalPlan: { type: string, enum: [free, pro, unlimited], nullable: true }
        referralCode: { type: string, nullable: true, example: JWAFQGV7 }
        cref: { type: string, nullable: true, example: '045982-G/SP' }
        biography: { type: string, nullable: true, maxLength: 2000 }
        experience: { type: string, nullable: true, enum: ['menos de 1 ano', '1-3 anos', '3-5 anos', 'mais de 5 anos'] }
        specializations: { type: array, nullable: true, items: { type: string }, example: [hipertrofia, condicionamento] }
        modality: { type: string, nullable: true, enum: [online, presencial, ambos] }
        methods: { type: array, nullable: true, items: { type: string }, example: [rir, dropset] }
        trainingSplits: { type: array, nullable: true, items: { type: string }, example: [abc, ppl] }
        goal: { type: string, nullable: true, example: hipertrofia }
        level: { type: string, nullable: true, enum: [iniciante, intermediario, avancado] }
        daysPerWeek: { type: integer, nullable: true, minimum: 1, maximum: 7 }
        restrictions: { type: string, nullable: true, maxLength: 2000 }
    PersonalProfileRequest:
      type: object
      description: Todos opcionais. Semântica de PATCH.
      properties:
        name: { type: string }
        phone: { type: string, nullable: true }
        isPublic: { type: boolean }
        personalPlan: { type: string, enum: [free, pro, unlimited], description: 'Aceito só em /complete. Ignorado em /update.' }
        cref: { type: string, nullable: true }
        biography: { type: string, nullable: true, maxLength: 2000 }
        experience: { type: string, enum: ['menos de 1 ano', '1-3 anos', '3-5 anos', 'mais de 5 anos'] }
        specializations: { type: array, items: { type: string } }
        modality: { type: string, enum: [online, presencial, ambos] }
        methods: { type: array, items: { type: string } }
        trainingSplits: { type: array, items: { type: string } }
    StudentProfileRequest:
      type: object
      description: Todos opcionais. Semântica de PATCH.
      properties:
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        goal: { type: string, example: hipertrofia }
        level: { type: string, enum: [iniciante, intermediario, avancado] }
        daysPerWeek: { type: integer, minimum: 1, maximum: 7 }
        restrictions: { type: string, nullable: true, maxLength: 2000 }

    # ---- Alunos / vínculo
    StudentSummary:
      type: object
      description: Aluno visto pelo Personal. Junta dados do usuário com dados do vínculo.
      required: [id, linkId, status, name, email, phone, photoUrl, goal, level, days, time, paymentValue, paymentStatus, paymentDueDay, anamnesisCompleted, hasWorkout, lastActivityAt, linkedAt]
      properties:
        id: { type: integer, description: 'Id do aluno; para pending_signup, o id do vínculo pendente.' }
        linkId: { type: integer }
        status: { type: string, enum: [active, pending_signup] }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        photoUrl: { type: string, nullable: true }
        goal: { type: string, nullable: true, example: Hipertrofia }
        level: { type: string, nullable: true, enum: [iniciante, intermediario, avancado] }
        days: { type: array, items: { type: string, enum: [Seg, Ter, Qua, Qui, Sex, Sáb, Dom] } }
        time: { type: string, nullable: true, pattern: '^\d{2}:\d{2}$', example: '07:00' }
        paymentValue: { type: number, format: double, nullable: true, example: 120.0 }
        paymentStatus: { type: string, enum: [pago, pendente] }
        paymentDueDay: { type: integer, nullable: true, minimum: 1, maximum: 31, example: 10 }
        anamnesisCompleted: { type: boolean }
        hasWorkout: { type: boolean }
        lastActivityAt: { type: string, format: date-time, nullable: true, description: 'Última sessão finalizada.' }
        linkedAt: { type: string, format: date-time }
    CreateStudentRequest:
      type: object
      required: [name, email]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        goal: { type: string, example: Hipertrofia }
        days: { type: array, items: { type: string, enum: [Seg, Ter, Qua, Qui, Sex, Sáb, Dom] } }
        time: { type: string, example: '08:00' }
        paymentValue: { type: number, format: double, example: 120.0 }
    CreateStudentResponse:
      type: object
      required: [relinked, student]
      properties:
        relinked: { type: boolean, description: 'true quando o e-mail já era de um aluno com conta.' }
        student: { $ref: '#/components/schemas/StudentSummary' }
    UpdateStudentRequest:
      type: object
      description: Todos opcionais. Semântica de PATCH.
      properties:
        name: { type: string }
        goal: { type: string }
        level: { type: string, enum: [iniciante, intermediario, avancado] }
        days: { type: array, items: { type: string, enum: [Seg, Ter, Qua, Qui, Sex, Sáb, Dom] } }
        time: { type: string, nullable: true }
        paymentValue: { type: number, format: double, nullable: true }
    BillingRequest:
      type: object
      description: Todos opcionais. Semântica de PATCH.
      properties:
        paymentValue: { type: number, format: double }
        paymentStatus: { type: string, enum: [pago, pendente] }
        paymentDueDay: { type: integer, minimum: 1, maximum: 31 }
        days: { type: array, items: { type: string, enum: [Seg, Ter, Qua, Qui, Sex, Sáb, Dom] } }
    PersonalPreview:
      type: object
      required: [id, name, email, photoUrl, cref]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        photoUrl: { type: string, nullable: true }
        cref: { type: string, nullable: true }
    StudentLink:
      type: object
      required: [id, personal, startedAt, origin]
      properties:
        id: { type: integer }
        personal: { $ref: '#/components/schemas/PersonalPreview' }
        startedAt: { type: string, format: date-time }
        origin: { type: string, enum: [personal_invite, student_confirm, consultoria] }

    # ---- Exercícios
    ExerciseRequest:
      type: object
      required: [name, muscleGroup]
      properties:
        name: { type: string, maxLength: 120 }
        muscleGroup: { type: string, enum: [Peito, Costas, Ombros, Braços, Pernas, Glúteos, Abdômen, Cardio, Outros] }
        level: { type: string, enum: [Iniciante, Intermediário, Avançado], default: Intermediário }
        videoUrl: { type: string, format: uri, nullable: true }
        notes: { type: string, nullable: true, maxLength: 2000 }
    Exercise:
      allOf:
        - $ref: '#/components/schemas/ExerciseRequest'
        - type: object
          required: [id, isCustom]
          properties:
            id: { type: integer }
            isCustom: { type: boolean }

    # ---- Treino
    WorkoutStructureRequest:
      type: object
      required: [division]
      properties:
        title: { type: string, maxLength: 120, default: Treino }
        division: { type: string, pattern: '^[A-G]{1,7}$', example: ABC }
        splitLabels:
          type: object
          additionalProperties: { type: string, maxLength: 60 }
          example: { A: Peito e Tríceps, B: Pernas, C: Costas e Bíceps }
    Workout:
      type: object
      description: |
        Um aluno tem no máximo **um** treino vigente. Criar outro arquiva o anterior.

        **Notificação ao aluno:** a primeira criação gera `workout_created`. Alterações geram `workout_updated`, no máximo **uma a cada 10 minutos** por aluno (o Personal faz várias edições seguidas).
      required: [id, studentId, title, division, splitLabels, version, createdAt, updatedAt, exercises]
      properties:
        id: { type: integer }
        studentId: { type: integer }
        createdBy: { type: integer, description: Id do Personal. }
        title: { type: string, example: Treino }
        division: { type: string, example: ABC }
        splitLabels:
          type: object
          additionalProperties: { type: string }
          example: { A: Peito e Tríceps, B: Pernas, C: Costas e Bíceps }
        version: { type: integer, example: 3 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        exercises:
          type: array
          items: { $ref: '#/components/schemas/PrescribedExercise' }
    PrescribedExerciseRequest:
      type: object
      required: [exerciseId, split, sets, reps]
      properties:
        exerciseId: { type: integer, description: Id do exercício no catálogo. }
        split: { type: string, pattern: '^[A-G]$', example: A }
        order: { type: integer, minimum: 0 }
        sets: { type: integer, minimum: 1, maximum: 20, example: 4 }
        reps: { type: string, maxLength: 20, example: '8-10' }
        intensityMethod: { type: string, nullable: true, maxLength: 120, example: 'Drop-set na última série' }
        weight: { type: string, nullable: true, maxLength: 20, example: '70kg' }
        rest: { type: string, nullable: true, maxLength: 20, example: '90s' }
        observations: { type: string, nullable: true, maxLength: 2000 }
        videoUrl: { type: string, format: uri, nullable: true, description: 'Sobrescreve o vídeo do catálogo só nesta prescrição.' }
    PrescribedExercisePatch:
      type: object
      description: Mesmos campos de `PrescribedExerciseRequest`, todos opcionais.
      properties:
        exerciseId: { type: integer }
        split: { type: string, pattern: '^[A-G]$' }
        order: { type: integer, minimum: 0 }
        sets: { type: integer, minimum: 1, maximum: 20 }
        reps: { type: string }
        intensityMethod: { type: string, nullable: true }
        weight: { type: string, nullable: true }
        rest: { type: string, nullable: true }
        observations: { type: string, nullable: true }
        videoUrl: { type: string, format: uri, nullable: true }
    PrescribedExercise:
      type: object
      required: [id, workoutId, exerciseId, name, muscleGroup, split, order, sets, reps, intensityMethod, weight, rest, observations, videoUrl]
      properties:
        id: { type: integer }
        workoutId: { type: integer }
        exerciseId: { type: integer }
        name: { type: string, description: Copiado do catálogo. }
        muscleGroup: { type: string, description: Copiado do catálogo. }
        split: { type: string, example: A }
        order: { type: integer }
        sets: { type: integer }
        reps: { type: string }
        intensityMethod: { type: string, nullable: true }
        weight: { type: string, nullable: true }
        rest: { type: string, nullable: true }
        observations: { type: string, nullable: true }
        videoUrl: { type: string, nullable: true, description: 'O da prescrição, senão o do catálogo.' }
    Revision:
      type: object
      required: [id, workoutId, version, changedBy, snapshot, createdAt]
      properties:
        id: { type: integer }
        workoutId: { type: integer }
        version: { type: integer }
        changedBy: { type: integer }
        snapshot: { $ref: '#/components/schemas/Workout' }
        createdAt: { type: string, format: date-time }
    Session:
      type: object
      required: [id, workoutId, workoutVersion, split, startedAt, finishedAt, durationSeconds, feedback, sets]
      properties:
        id: { type: integer }
        workoutId: { type: integer }
        workoutVersion: { type: integer }
        split: { type: string, example: A }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time, nullable: true }
        durationSeconds: { type: integer, nullable: true }
        feedback: { type: string, nullable: true }
        sets:
          type: array
          items: { $ref: '#/components/schemas/SetLog' }
    SetLogRequest:
      type: object
      required: [completed]
      properties:
        completed: { type: boolean }
        load: { type: string, nullable: true, maxLength: 20, example: '72kg' }
        reps: { type: integer, nullable: true, minimum: 0 }
    SetLog:
      type: object
      required: [sessionId, prescribedId, setIndex, completed, load, reps, recordedAt]
      properties:
        sessionId: { type: integer }
        prescribedId: { type: integer }
        setIndex: { type: integer }
        completed: { type: boolean }
        load: { type: string, nullable: true }
        reps: { type: integer, nullable: true }
        recordedAt: { type: string, format: date-time }
    StudentStats:
      type: object
      required: [totalSessions, sessionsThisWeek, weeklyGoal, consecutiveWeeks, completedSets, lastActivityAt, weekDays]
      properties:
        totalSessions: { type: integer, example: 48 }
        sessionsThisWeek: { type: integer, example: 2 }
        weeklyGoal: { type: integer, example: 4 }
        consecutiveWeeks: { type: integer, example: 6 }
        completedSets: { type: integer, example: 912 }
        lastActivityAt: { type: string, format: date-time, nullable: true }
        weekDays:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: object
            required: [day, date, trained]
            properties:
              day: { type: string, enum: [Seg, Ter, Qua, Qui, Sex, Sáb, Dom] }
              date: { type: string, format: date }
              trained: { type: boolean }

    # ---- Saúde
    AnamnesisRequest:
      type: object
      required: [experience, customGoal, dailyTrainingTime, hasBoneJointRisk, hasCardioRiskFamily, hasCardioRisk, usesMedication]
      properties:
        experience: { type: string, example: Intermediário }
        customGoal: { type: string, maxLength: 200, example: Hipertrofia muscular }
        dailyTrainingTime: { type: string, example: '1h00' }
        hasBoneJointRisk: { type: boolean }
        boneJointDetails: { type: string, nullable: true, maxLength: 2000 }
        hasCardioRiskFamily: { type: boolean }
        hasCardioRisk: { type: boolean }
        usesMedication: { type: boolean }
        medicationDetails: { type: string, nullable: true, maxLength: 2000 }
        dietPlan: { type: string, nullable: true, maxLength: 2000 }
    Anamnesis:
      allOf:
        - $ref: '#/components/schemas/AnamnesisRequest'
        - type: object
          required: [studentId, updatedAt]
          properties:
            studentId: { type: integer }
            updatedAt: { type: string, format: date-time }
    MeasurementRequest:
      type: object
      description: Todas as medidas em cm, peso em kg, gordura em %. Pelo menos uma medida.
      properties:
        measuredAt: { type: string, format: date }
        weight: { type: number, format: double, minimum: 20, maximum: 400, example: 80.5 }
        bodyFat: { type: number, format: double, minimum: 2, maximum: 70, example: 14.2 }
        chest: { type: number, format: double, minimum: 30, maximum: 250, example: 102 }
        waist: { type: number, format: double, minimum: 30, maximum: 250, example: 81 }
        arm: { type: number, format: double, minimum: 10, maximum: 80, example: 38.5 }
        hips: { type: number, format: double, minimum: 30, maximum: 250, example: 96 }
        thigh: { type: number, format: double, minimum: 20, maximum: 120, example: 58 }
        calf: { type: number, format: double, minimum: 15, maximum: 80, example: 37.5 }
    Measurement:
      type: object
      description: Campos de medida não informados voltam `null`.
      required: [id, studentId, measuredAt, weight, bodyFat, chest, waist, arm, hips, thigh, calf, createdAt]
      properties:
        id: { type: integer }
        studentId: { type: integer }
        measuredAt: { type: string, format: date }
        weight: { type: number, format: double, nullable: true }
        bodyFat: { type: number, format: double, nullable: true }
        chest: { type: number, format: double, nullable: true }
        waist: { type: number, format: double, nullable: true }
        arm: { type: number, format: double, nullable: true }
        hips: { type: number, format: double, nullable: true }
        thigh: { type: number, format: double, nullable: true }
        calf: { type: number, format: double, nullable: true }
        createdAt: { type: string, format: date-time }
    ProgressPhoto:
      type: object
      required: [id, studentId, angle, takenAt, label, url, mimeType, size, createdAt]
      properties:
        id: { type: integer }
        studentId: { type: integer }
        angle: { type: string, enum: [front, side, back] }
        takenAt: { type: string, format: date }
        label: { type: string, nullable: true }
        url: { type: string, example: '/photos/31/content' }
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: integer, maximum: 10485760 }
        createdAt: { type: string, format: date-time }

    # ---- Notificações / Personal
    Notification:
      type: object
      required: [id, type, title, message, data, createdAt, readAt]
      properties:
        id: { type: integer }
        type:
          type: string
          enum: [manual, link_confirmed, link_ended, workout_created, workout_updated, workout_completed, anamnesis_completed, measurement_added, payment_received]
          description: |
            Quem recebe:
            - Aluno: `manual`, `link_confirmed`, `link_ended`, `workout_created`, `workout_updated`.
            - Personal: `link_confirmed`, `link_ended`, `workout_completed`, `anamnesis_completed`, `measurement_added`, `payment_received`.
        title: { type: string, example: Novo treino disponível }
        message: { type: string, example: Vitória Neri enviou um novo treino para você. }
        data:
          type: object
          description: Ids relacionados para o app abrir a tela certa. Chaves ausentes quando não se aplicam.
          properties:
            studentId: { type: integer }
            personalId: { type: integer }
            workoutId: { type: integer }
            sessionId: { type: integer }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
    Dashboard:
      type: object
      required: [totalStudents, activeStudents, pendingAnamnesis, studentsWithoutWorkout, maxStudents, recentActivity]
      properties:
        totalStudents: { type: integer }
        activeStudents: { type: integer }
        pendingAnamnesis: { type: integer }
        studentsWithoutWorkout: { type: integer }
        maxStudents: { type: integer, nullable: true, description: 'null = ilimitado.' }
        recentActivity:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
    ReferralSummary:
      type: object
      required: [code, totalDiscount, referredCount, credits]
      properties:
        code: { type: string, example: JWAFQGV7 }
        totalDiscount: { type: number, format: double, example: 15.0 }
        referredCount: { type: integer, example: 3 }
        credits:
          type: array
          items:
            type: object
            required: [id, name, date, credit, status]
            properties:
              id: { type: integer }
              name: { type: string, description: Nome do Personal indicado. Nunca o e-mail. }
              date: { type: string, format: date-time }
              credit: { type: number, format: double, example: 5.0 }
              status: { type: string, enum: [pending, applied] }
    ConsultoriaCheckoutResponse:
      type: object
      required: [transactionId, status, plan, startsAt, endsAt, link]
      properties:
        transactionId: { type: string, example: sim_8f2c1a }
        status: { type: string, enum: [approved] }
        plan: { type: string, enum: [mensal, trimestral, semestral] }
        startsAt: { type: string, format: date }
        endsAt: { type: string, format: date }
        link: { $ref: '#/components/schemas/StudentLink' }
    SupportTicket:
      type: object
      required: [id, category, message, status, createdAt]
      properties:
        id: { type: integer }
        category: { type: string }
        message: { type: string }
        status: { type: string, enum: [open, answered, closed] }
        createdAt: { type: string, format: date-time }
