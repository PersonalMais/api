      responses:
        '201':
          description: Foto criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressPhoto' }
        '409':
          description: '`PHOTO_LIMIT_REACHED`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

