      tags: [Saúde e evolução (Aluno)]
      summary: '[FALTA] Apagar registro de medidas'
      x-status: falta
      responses:
        '204': { description: Apagado. }
        '404': { $ref: '#/components/responses/NotFound' }

  /aluno/photos:
    get:
      tags: [Saúde e evolução (Aluno)]
      summary: '[FALTA] Minhas fotos de progresso'
      x-status: falta
      description: Ordenadas por `takenAt` crescente, depois `angle` (front, side, back).
      responses:
        '200':
          description: Fotos.
          content:
            application/json:
              schema:
                type: array
